cortex:
  llm:
    backend: mock

spring:
  application:
    name: cortex
  datasource:
    url: jdbc:postgresql://localhost:5432/cortex
    username: cortex
    password: cortex
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4:26b
          temperature: 0.2

server:
  port: 8080
